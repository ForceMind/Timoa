<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2fa87c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1713" media="(prefers-color-scheme: dark)" />
    <script>
      // 外观偏好首屏防闪烁：在 React 挂载前恢复主题/字号（与 src/theme.ts 逻辑一致）。
      (function () {
        try {
          var t = localStorage.getItem('xz-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (localStorage.getItem('xz-font-size') === 'large') document.documentElement.dataset.fontsize = 'large'
        } catch (e) { /* localStorage 不可用时保持默认浅色 */ }
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小账" />
    <title>Timoa · 小账</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
