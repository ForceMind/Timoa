name: release

# 推送 v* tag 时自动构建并发布到 GitHub Releases：
#   git tag v1.0.0 && git push origin v1.0.0
# 产物：xiaozhang-linux-amd64 / xiaozhang-linux-arm64（前端嵌入、CGO_ENABLED=0 纯静态）+ SHA256SUMS
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: 构建前端
        run: |
          cd web
          npm ci
          npx tsc --noEmit
          npm run build

      - name: 嵌入前端产物
        run: |
          find internal/webdist/dist -mindepth 1 -delete
          cp -r web/dist/* internal/webdist/dist/

      - name: 后端测试
        run: go test ./...

      - name: 交叉编译（amd64 + arm64）
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "xiaozhang-linux-$arch" ./cmd/xiaozhang
          done
          sha256sum xiaozhang-linux-* > SHA256SUMS
          ls -lh xiaozhang-linux-* SHA256SUMS

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xiaozhang-linux-amd64
            xiaozhang-linux-arm64
            SHA256SUMS
          generate_release_notes: true
